name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.21.x', '1.22.x', '1.23.x' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Enforce Architectural Invariants (AST Analysis)
        run: |
          go run scripts/enforce_standards.go

      - name: Check Formatting
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Run Go Vet
        run: |
          go vet ./...

      - name: Run Unit Tests with Race Detector
        run: |
          go test -v -count=1 -race ./...

      - name: Build Static Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -extldflags '-static'" -o talaria main.go
          ./talaria --help

  cross-compile:
    name: Cross-Compilation Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Compile Multi-Architecture Binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64 386; do
            echo "Building for linux/${arch}..."
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -trimpath -ldflags="-s -w -extldflags '-static'" -o dist/talaria_linux_${arch} main.go
          done
          ls -la dist/
